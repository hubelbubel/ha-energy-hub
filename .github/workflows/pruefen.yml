name: Prüfen

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests der Regelung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_export.mjs tests/test_energy.mjs

  hassfest:
    name: Hassfest (Home-Assistant-Vorgaben)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
