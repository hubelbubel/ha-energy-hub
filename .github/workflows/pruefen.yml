name: Prüfen

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests der Regelung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_export.mjs tests/test_energy.mjs tests/test_pv.mjs

  hassfest:
    name: Hassfest (Home-Assistant-Vorgaben)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Steigt die Version in manifest.json, entsteht nach bestandenen Prüfungen ein Release.
  # Sein Text ist der Abschnitt der Version aus CHANGELOG.md; den zeigt Home Assistant beim Update.
  # Der Marketplace (vorher HACS) zeigt die Versionsnummer und bietet nur Releases als Update an.
  release:
    name: Release für neue Version
    needs: [tests, hassfest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen oder seinen Text aus CHANGELOG.md aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/energy_hub/manifest.json)
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md hat keinen Abschnitt für $version" >&2
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            gh release edit "$version" --notes-file notes.md
          else
            gh release create "$version" --target "$GITHUB_SHA" --title "Energy Hub $version" --notes-file notes.md
          fi
