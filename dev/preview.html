<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Hub – Vorschau mit Beispieldaten</title>
<style>
  html, body { margin: 0; }
  body { font-family: Roboto, system-ui, sans-serif; }
  body.dark {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --primary-background-color: #111111; --card-background-color: #1c1c1c;
    --divider-color: rgba(225, 225, 225, 0.12); --primary-color: #03a9f4;
  }
  body.light {
    --primary-text-color: #212121; --secondary-text-color: #727272;
    --primary-background-color: #fafafa; --card-background-color: #ffffff;
    --divider-color: rgba(0, 0, 0, 0.12); --primary-color: #03a9f4;
  }
</style>
</head>
<body class="light">
<!--
  Vorschau des Panels ohne Home Assistant, mit erfundenen Beispieldaten.
  Start:  python3 -m http.server 8000   (im Hauptordner des Repositories)
  Dann:   http://localhost:8000/dev/preview.html
  Parameter: ?theme=dark  ?mode=normal|boost|setback|override|empty  ?tab=overview|power|pv|heat
-->
<script type="module">
  import "../custom_components/energy_hub/frontend/energy-hub-panel.js";

  const q = new URLSearchParams(location.search);
  const dark = q.get("theme") === "dark";
  const scene = q.get("mode") || "boost";
  document.body.className = dark ? "dark" : "light";

  const now = Date.now();
  const iso = (ms) => new Date(ms).toISOString();
  const ent = {
    ent_flow: "sensor.wp_vorlauftemperatur", ent_return: "sensor.wp_rucklauftemperatur",
    ent_return_target: "sensor.wp_rucklaufsolltemperatur", ent_dhw: "sensor.wp_warmwassertemperatur",
    ent_dhw_target: "sensor.wp_warmwasser_soll_aktuell", ent_outdoor: "sensor.wp_aussentemperatur",
    ent_status: "sensor.wp_status", ent_compressor: "binary_sensor.wp_verdichter_1",
    ent_power_el: "sensor.wp_elektrische_leistung", ent_power_heat: "sensor.wp_heizleistung",
    ent_pv_surplus: "sensor.pv_ueberschuss", ent_forecast_today: "sensor.pv_prognose_rest_heute",
    ent_forecast_tomorrow: "sensor.pv_prognose_morgen",
    ent_smart_grid: "select.wp_smart_grid_setzen", ent_shift: null,
    ent_energy_el: null, ent_energy_heat: "sensor.wp_warmemenge_heizen",
    ent_energy_dhw: "sensor.wp_warmemenge_warmwasser", ent_energy_env: null,
    ent_heater: "binary_sensor.wp_flanschheizung_e9", ent_second_heat: null,
    ent_storage: "sensor.wp_regenerativspeicher_temperatur", ent_lock: "sensor.wp_sperre",
    ent_fireplace: "sensor.kamin_exhaust_temperature", ent_fireplace_status: "sensor.kamin_status",
  };
  const fireNow = scene === "setback" || scene === "override";

  // Strom: erfundene Anlage mit PV, Batterie (5 kWh, 2,5 kW), Wallbox und vier Geräten
  const pw = {
    ent_grid_power: "sensor.netz_leistung", ent_pv_power: "sensor.pv_leistung",
    ent_battery_power: "sensor.venus_leistung", ent_battery_soc: "sensor.venus_ladestand",
    ent_house_power: null, ent_wallbox_power: "sensor.goe_leistung",
  };
  const consumers = ["sensor.badheizung_leistung", "sensor.waschmaschine_leistung",
    "sensor.trockner_leistung", "sensor.spuelmaschine_leistung"];
  const friendly = {
    "sensor.badheizung_leistung": "Badheizung Leistung", "sensor.waschmaschine_leistung": "Waschmaschine Leistung",
    "sensor.trockner_leistung": "Trockner Leistung", "sensor.spuelmaschine_leistung": "Spülmaschine Leistung",
  };
  // PV: ZCS Azzurro mit einem String an MPPT 1, darin 14 Module mit Tigo-Optimierern.
  // A4 ist verschmutzt, A9 liegt nachmittags im Schatten, A12 verliert ab und zu die Funkverbindung, A2 wird warm.
  const inv = {
    ent_inv_status: "sensor.azzurro_status", ent_mppt1_power: "sensor.pv_power",
    ent_mppt1_voltage: "sensor.azzurro_pv1_spannung", ent_mppt1_current: "sensor.azzurro_pv1_strom",
    ent_mppt2_power: null, ent_mppt2_voltage: null, ent_mppt2_current: null,
    ent_grid_frequency: "sensor.azzurro_netz_frequenz",
    ent_pv_energy_today: "sensor.pv_generation_today", ent_pv_energy_total: "sensor.pv_generation_total",
    ent_load_energy_today: "sensor.azzurro_hausverbrauch_heute", ent_load_energy_total: "sensor.azzurro_hausverbrauch_gesamt",
    ent_import_energy_today: "sensor.azzurro_netzbezug_heute", ent_import_energy_total: "sensor.azzurro_netzbezug_gesamt",
    ent_export_energy_today: "sensor.azzurro_netzeinspeisung_heute", ent_export_energy_total: "sensor.azzurro_netzeinspeisung_gesamt",
  };
  const LABELS = Array.from({ length: 14 }, (_x, i) => `A${i + 1}`);
  const METRICS = ["power", "voltage_in", "voltage_out", "current", "temperature", "pwm", "energy_today"];
  const pid = (label, key) => `sensor.panel_${label.toLowerCase()}_${key}`;
  const layout = {
    found: true,
    panels: LABELS.map((label) => ({ label, string: "A", entry_id: "x",
      entities: Object.fromEntries(METRICS.map((key) => [key, pid(label, key)])) })),
    strings: [{ name: "A", entities: { power: "sensor.tigo_string_a_power", energy_today: "sensor.tigo_string_a_energy_today" } }],
    installation: { energy_today: "sensor.tigo_installation_energy_today" },
  };
  // Tagessummen (kWh seit Mitternacht) für die Zähler des Wechselrichters
  const COUNTERS = {
    "sensor.pv_generation_today": ["pv", true], "sensor.pv_generation_total": ["pv", false],
    "sensor.azzurro_hausverbrauch_heute": ["load", true], "sensor.azzurro_hausverbrauch_gesamt": ["load", false],
    "sensor.azzurro_netzbezug_heute": ["imp", true], "sensor.azzurro_netzbezug_gesamt": ["imp", false],
    "sensor.azzurro_netzeinspeisung_heute": ["exp", true], "sensor.azzurro_netzeinspeisung_gesamt": ["exp", false],
  };
  function panelFactor(label, t, hour) {
    if (label === "A4") return 0.86;
    if (label === "A9" && hour >= 14.5 && hour < 16.5) return 0.42;
    if (label === "A12" && Math.sin(t / 7.1e5) > 0.96) return 0;
    return 1 + 0.025 * Math.sin(t / 3e5 + LABELS.indexOf(label));
  }

  const STEP = 300e3;
  function simulate(t0, t1) {
    const out = {};
    const ids = [pw.ent_grid_power, pw.ent_pv_power, pw.ent_battery_power, pw.ent_battery_soc, pw.ent_wallbox_power,
      "sensor.wp_elektrische_leistung", ...consumers, "sensor.pv_power", "sensor.azzurro_pv1_spannung",
      "sensor.azzurro_pv1_strom", "sensor.azzurro_netz_frequenz", ...Object.keys(COUNTERS),
      ...LABELS.flatMap((label) => METRICS.map((key) => pid(label, key)))];
    for (const id of ids) out[id] = [];
    let soc = 2.0; // kWh im Speicher, nutzbar 0,55 bis 5,0
    const day = { pv: 0, load: 0, imp: 0, exp: 0 };
    const tot = { pv: 8120, load: 9430, imp: 3210, exp: 2950 };
    const panelDay = Object.fromEntries(LABELS.map((label) => [label, 0]));
    let lastDay = null;
    for (let t = t0; t < t1; t += STEP) {
      const d = new Date(t);
      const hour = d.getHours() + d.getMinutes() / 60;
      const odd = Math.floor(t / 86400e3) % 2 === 1;
      const sun = Math.max(0, Math.sin(((hour - 7.5) / 9.5) * Math.PI));
      const cloud = 0.72 + 0.28 * Math.sin(t / 9e5) * Math.cos(t / 23e5);
      if (lastDay !== d.getDate()) {
        lastDay = d.getDate();
        for (const k of Object.keys(day)) day[k] = 0;
        for (const label of LABELS) panelDay[label] = 0;
      }
      const vMppt = sun > 0 ? 432 + 18 * sun : 0;
      let tigo = 0;
      const panelW = LABELS.map((label) => {
        const w = sun > 0.02 ? Math.max(0, (sun * cloud * 6950 / LABELS.length) * panelFactor(label, t, hour)) : 0;
        tigo += w;
        return w;
      });
      const pv = tigo * 0.976;
      const iString = vMppt > 0 ? pv / vMppt : 0;
      LABELS.forEach((label, i) => {
        const w = panelW[i];
        const vin = w > 0 ? 33.2 + 3.1 * sun - (label === "A4" ? 0.6 : 0) : 0;
        panelDay[label] += (w * STEP) / 3.6e9;
        out[pid(label, "power")].push(w);
        out[pid(label, "voltage_in")].push(vin);
        out[pid(label, "current")].push(vin > 0 ? w / vin : 0);
        out[pid(label, "voltage_out")].push(iString > 0 ? (w * 0.99) / iString : 0);
        out[pid(label, "temperature")].push(sun > 0.02 ? 7 + 24 * sun * cloud + (label === "A2" ? 7 : 0) : null);
        out[pid(label, "pwm")].push(w > 0 ? Math.round(180 + 60 * sun) : null);
        out[pid(label, "energy_today")].push(panelDay[label]);
      });
      out["sensor.pv_power"].push(Math.round(pv / 10) * 10);
      out["sensor.azzurro_pv1_spannung"].push(vMppt);
      out["sensor.azzurro_pv1_strom"].push(iString);
      out["sensor.azzurro_netz_frequenz"].push(50 + 0.02 * Math.sin(t / 4e5));
      const cyc = Math.sin(t / 26e5);
      const wp = cyc > -0.3 ? 1800 + 300 * cyc : 40;
      const bath = hour >= 6.2 && hour < 7 ? 900 : 0;
      const wash = odd && hour >= 9.5 && hour < 10.7 ? 620 : 2;
      const dry = odd && hour >= 19.5 && hour < 20.7 ? 1150 : 1;
      const dish = hour >= 21.2 && hour < 22.4 ? 820 : 1;
      const base = 290 + 70 * Math.sin(t / 5e5);
      const house = base + wp + bath + wash + dry + dish;
      // Wallbox im Überschuss-Modus: lädt nur, wenn nach dem Haus genug übrig ist
      const wallbox = !odd && hour >= 10.5 && hour < 15 && pv - house > 1500 ? Math.min(3700, pv - house - 200) : 0;
      const net = pv - house - wallbox;
      let chg = 0;
      let dis = 0;
      if (net > 0) chg = Math.min(net, 2500, ((5.0 - soc) * 1000 * 3600e3) / STEP);
      else dis = Math.min(-net, 2500, ((soc - 0.55) * 1000 * 3600e3) / STEP);
      soc += ((chg * 0.95 - dis) * STEP) / 3600e3 / 1000;
      out[pw.ent_pv_power].push(pv);
      out[pw.ent_battery_power].push(dis - chg);
      out[pw.ent_battery_soc].push((soc / 5.12) * 100);
      out[pw.ent_grid_power].push(house + wallbox + chg - dis - pv);
      out[pw.ent_wallbox_power].push(wallbox);
      out["sensor.wp_elektrische_leistung"].push(wp);
      [bath, wash, dry, dish].forEach((v, i) => out[consumers[i]].push(v));
      const grid = house + wallbox + chg - dis - pv;
      const add = { pv, load: house + wallbox, imp: Math.max(0, grid), exp: Math.max(0, -grid) };
      for (const k of Object.keys(add)) {
        day[k] += (add[k] * STEP) / 3.6e9;
        tot[k] += (add[k] * STEP) / 3.6e9;
      }
      for (const [id, [k, today]] of Object.entries(COUNTERS)) out[id].push(today ? day[k] : tot[k]);
    }
    return out;
  }
  const midnight = new Date();
  midnight.setHours(0, 0, 0, 0);
  const nowSim = simulate(midnight.getTime() - 48 * 3600e3, Date.now());
  const extra = ["sensor.wp_statuscode", "binary_sensor.wp_heizungspumpe_m13"];
  const st = (state, unit) => ({ state: String(state), attributes: { unit_of_measurement: unit } });
  const running = scene !== "normal";
  const states = {
    [ent.ent_flow]: st(running ? 36.4 : 29.1, "°C"), [ent.ent_return]: st(running ? 31.2 : 28.6, "°C"),
    [ent.ent_return_target]: st(scene === "boost" ? 33.0 : 30.5, "°C"), [ent.ent_dhw]: st(48.3, "°C"),
    [ent.ent_dhw_target]: st(scene === "boost" ? 55 : 48, "°C"), [ent.ent_outdoor]: st(6.4, "°C"),
    [ent.ent_status]: st(running ? "Heizen" : "Aus"), [ent.ent_compressor]: st(running ? "on" : "off"),
    [ent.ent_power_el]: st(running ? 1840 : 40, "W"), [ent.ent_power_heat]: st(running ? 7350 : 0, "W"),
    [ent.ent_pv_surplus]: st(2140, "W"), [ent.ent_forecast_today]: st(11.8, "kWh"),
    [ent.ent_forecast_tomorrow]: st(19.4, "kWh"),
    [ent.ent_storage]: st(fireNow ? 58.4 : 36.2, "°C"), [ent.ent_lock]: st(fireNow ? "Regenerativ" : "Keine"),
    [ent.ent_fireplace]: st(fireNow ? 246 : 28, "°C"), [ent.ent_fireplace_status]: st(fireNow ? "Heizbetrieb" : "Standby"),
  };
  for (const id of [...Object.values(pw).filter(Boolean), ...consumers]) {
    const value = nowSim[id].at(-1);
    states[id] = { state: String(Math.round(value * 10) / 10),
      attributes: { unit_of_measurement: id.includes("ladestand") ? "%" : "W", friendly_name: friendly[id] } };
  }
  const pvIds = [...Object.values(inv).filter(Boolean), ...LABELS.flatMap((label) => METRICS.map((key) => pid(label, key)))];
  for (const id of pvIds) {
    if (!nowSim[id]) continue;
    const value = nowSim[id].at(-1);
    const unit = /energy|generation|verbrauch|bezug|einspeisung/.test(id) ? "kWh" : /spannung|voltage/.test(id) ? "V"
      : /strom|current/.test(id) ? "A" : /temperature/.test(id) ? "°C" : /frequenz/.test(id) ? "Hz" : /pwm/.test(id) ? undefined : "W";
    states[id] = { state: value === null ? "unknown" : String(Math.round(value * 100) / 100), attributes: { unit_of_measurement: unit } };
  }
  states["sensor.tigo_installation_energy_today"] = st(LABELS.reduce((sum, label) => sum + nowSim[pid(label, "energy_today")].at(-1), 0).toFixed(2), "kWh");
  states["sensor.azzurro_status"] = st(nowSim["sensor.pv_power"].at(-1) > 0 ? 2 : 0);
  Object.assign(ent, pw, inv);

  const log = scene === "empty" ? [] : [
    { ts: iso(now - 38 * 60e3), kind: "switch", from: "normal", to: "boost", result: "sent",
      detail: "select.wp_smart_grid_setzen → Verstärkter Betrieb (grün)",
      text: "Der PV-Überschuss liegt seit 10 min über 1.500 W (aktuell 2.140 W).",
      values: { surplus_w: 2140, forecast_kwh: 11.8, outdoor_c: 6.4, dhw_c: 46.1 } },
    { ts: iso(now - 150 * 60e3), kind: "switch", from: "setback", to: "normal", result: "sent",
      detail: "select.wp_smart_grid_setzen → Normalbetrieb (gelb)",
      text: "Der PV-Überschuss von 420 W liegt unter der Einschaltschwelle von 1.500 W. Abgesenkt wird nur 05:00–10:00 Uhr.",
      values: { surplus_w: 420, forecast_kwh: 14.9, outdoor_c: 4.8, dhw_c: 44.0 } },
    { ts: iso(now - 420 * 60e3), kind: "switch", from: "normal", to: "setback", result: "sent",
      detail: "select.wp_smart_grid_setzen → Abgesenkter Betrieb (rot)",
      text: "Für den Rest des Tages sind 18,2 kWh PV-Ertrag vorhergesagt. Die Heizung wartet im Absenkfenster (05:00–10:00 Uhr) auf eigenen Strom.",
      values: { surplus_w: 0, forecast_kwh: 18.2, outdoor_c: 3.6, dhw_c: 46.5 } },
    { ts: iso(now - 26 * 3600e3), kind: "error", from: "boost", to: null, result: "failed",
      detail: "select.wp_smart_grid_setzen ist nicht verfügbar.",
      text: "Die Vorgabe „Normalbetrieb“ konnte nicht gesetzt werden. Nächster Versuch um 16:52 Uhr.",
      values: { surplus_w: 120, forecast_kwh: 0.4, outdoor_c: 5.1, dhw_c: 51.2 } },
    { ts: iso(now - 29 * 3600e3), kind: "override", text: "Handbetrieb gestartet: Anheben, bis 15:40 Uhr.",
      values: { surplus_w: 900, forecast_kwh: 3.1, outdoor_c: 7.0, dhw_c: 43.9 } },
    { ts: iso(now - 30 * 3600e3), kind: "automation", text: "Automatik eingeschaltet.", values: {} },
  ];

  const mode = { boost: "boost", setback: "setback", override: "setback" }[scene] || "normal";
  const snapshot = {
    version: "0.5.0",
    export_extra: scene === "empty" ? [] : extra,
    consumers: scene === "empty" ? [] : consumers,
    entities: scene === "empty"
      ? { ...ent, ent_pv_surplus: null, ent_forecast_today: null, ent_forecast_tomorrow: null,
          ent_storage: null, ent_lock: null, ent_fireplace: null, ent_fireplace_status: null,
          ent_grid_power: null, ent_pv_power: null, ent_battery_power: null, ent_battery_soc: null, ent_wallbox_power: null,
          ...Object.fromEntries(Object.keys(inv).map((key) => [key, null])) }
      : ent,
    settings: {
      boost_on_w: 1500, boost_on_min: 10, boost_off_w: 300, boost_off_min: 15, min_hold_min: 20,
      setback_enabled: true, setback_start: "05:00:00", setback_end: "10:00:00",
      setback_min_forecast_kwh: 10, setback_min_outdoor_c: 3, setback_min_dhw_c: 42,
      actuator: scene === "empty" ? "dry_run" : "smart_grid", shift_boost_k: 2, shift_setback_k: 2,
      surplus_sign: "surplus_positive",
      grid_sign: "import_positive", battery_sign: "discharge_positive", tigo_string_mppt1: null, tigo_string_mppt2: null,
      storage_ready_delta_k: 5, storage_ready_c: 40, storage_blocks_boost: true, fireplace_on_c: 80, lock_regen_value: "Regenerativ",
    },
    state: {
      mode, since: iso(now - 38 * 60e3), automation: true, dry_run: scene === "empty",
      override: scene === "override" ? { mode: "setback", until: iso(now + 95 * 60e3) } : null,
      reason: {
        boost: "Der PV-Überschuss reicht weiter aus (aktuell 2.140 W). Beendet wird unter 300 W für 15 min.",
        setback: "Für den Rest des Tages sind 11,8 kWh PV-Ertrag vorhergesagt. Die Heizung wartet im Absenkfenster (05:00–10:00 Uhr) auf eigenen Strom.",
        normal: "Der PV-Überschuss von 2.140 W liegt erst seit 4 min über 1.500 W; angehoben wird nach 10 min. Abgesenkt wird nur 05:00–10:00 Uhr.",
      }[mode],
      rule: "boost_keep", state_entity_id: "sensor.energy_hub_regelzustand", last_error: null, retry_at: null,
      above_since: scene === "empty" ? null : iso(now - 48 * 60e3), below_since: null,
      inputs: { surplus_w: scene === "empty" ? null : 2140, forecast_kwh: 11.8, forecast_tomorrow_kwh: 19.4, outdoor_c: 6.4, dhw_c: 48.3 },
    },
    log, log_rev: 1,
  };

  // Erfundener Tagesverlauf: Sonne mittags, Heizung taktet, Warmwasser wird mittags geladen
  function history(id, t0, t1) {
    const rows = [];
    const stepMs = 5 * 60e3;
    for (let t = t0; t <= t1; t += stepMs) {
      const d = new Date(t);
      const hour = d.getHours() + d.getMinutes() / 60;
      const sun = Math.max(0, Math.sin(((hour - 7.5) / 9.5) * Math.PI));
      const cloud = 0.75 + 0.25 * Math.sin(t / 9e5) * Math.cos(t / 23e5);
      const boost = hour > 11.2 && hour < 15.4;
      const setback = hour >= 5 && hour < 9.5;
      const cyc = Math.sin(t / 26e5);
      const fire = hour >= 17.5 && hour < 21.5;
      const storeTemp = fire ? 36 + (hour - 17.5) * 8.5 : 70 - ((hour + 24 - 21.5) % 24) * 1.9;
      let v;
      if (id === ent.ent_pv_surplus) v = Math.round(sun * cloud * 3900 - 350);
      else if (id === ent.ent_outdoor) v = 3 + 5 * Math.max(0, Math.sin(((hour - 6) / 14) * Math.PI));
      else if (id === ent.ent_flow) v = (boost ? 36 : setback ? 27.5 : 31.5) + 2.4 * cyc;
      else if (id === ent.ent_return) v = (boost ? 31.5 : setback ? 25.5 : 28.3) + 1.6 * cyc;
      else if (id === ent.ent_dhw) v = boost ? 44 + (hour - 11.2) * 2.6 : 50.5 - ((hour + 24 - 15.4) % 24) * 0.42;
      else if (id === snapshot.state.state_entity_id) v = boost ? "boost" : setback ? "setback" : "normal";
      else if (id === ent.ent_compressor) v = cyc > -0.3 ? "on" : "off";
      else if (id === ent.ent_status) v = cyc > -0.3 ? (hour > 12 && hour < 13 ? "Warmwasser" : "Heizen") : "Aus";
      else if (id === ent.ent_power_el) v = cyc > -0.3 ? 1800 + 300 * cyc : 40;
      else if (id === ent.ent_power_heat) v = cyc > -0.3 ? 7200 + 800 * cyc : 0;
      else if (id === ent.ent_heater) v = hour >= 13 && hour < 13.2 ? "on" : "off";
      else if (id === ent.ent_energy_heat) v = 5000 + Math.floor((t / 3600e3) * 3.1) % 100000;
      else if (id === ent.ent_energy_dhw) v = 900 + Math.floor((t / 86400e3) * 6) % 10000;
      else if (id === ent.ent_return_target) v = boost ? 33 : setback ? 27 : 30.5;
      else if (id === ent.ent_dhw_target) v = boost ? 55 : 48;
      else if (id === ent.ent_forecast_today) v = Math.max(0, 19 - hour * 1.2);
      else if (id === ent.ent_forecast_tomorrow) v = 19.4;
      else if (id === ent.ent_smart_grid) v = boost ? "Verstärkter Betrieb (grün)" : setback ? "Abgesenkter Betrieb (rot)" : "Normalbetrieb (gelb)";
      else if (id === ent.ent_storage) v = storeTemp;
      else if (id === ent.ent_fireplace) v = fire ? 235 + 40 * Math.sin(t / 4e5) : 28;
      else if (id === ent.ent_fireplace_status) v = fire ? "Heizbetrieb" : "Standby";
      else if (id === ent.ent_lock) v = storeTemp >= 42 && Math.sin(t / 19e5) > 0.1 ? "Regenerativ" : "Keine";
      else if (id === "sensor.wp_statuscode") v = cyc > -0.3 ? 2 : 0;
      else if (id === "binary_sensor.wp_heizungspumpe_m13") v = "on";
      else if (id === "sensor.azzurro_status") v = t > now - 30 * 3600e3 && t < now - 29.8 * 3600e3 ? 4 : sun > 0.02 ? 2 : 0;
      else continue;
      rows.push({ s: String(typeof v === "number" ? Math.round(v * 10) / 10 : v), lu: t / 1000 });
    }
    return rows;
  }

  const hass = {
    themes: { darkMode: dark },
    states,
    connection: {
      subscribeMessage(cb) { setTimeout(() => cb(structuredClone(snapshot)), 30); return Promise.resolve(() => {}); },
    },
    async callWS(msg) {
      if (msg.type === "history/history_during_period") {
        const t0 = new Date(msg.start_time).getTime();
        const t1 = new Date(msg.end_time).getTime();
        return Object.fromEntries(msg.entity_ids.map((id) => [id, scene === "empty" ? [] : history(id, t0, t1)]));
      }
      if (msg.type === "recorder/statistics_during_period") {
        // Statistik nur für die Strom-Sensoren; alles andere holt das Panel aus dem Verlauf
        const t0 = new Date(msg.start_time).getTime();
        const t1 = Math.min(new Date(msg.end_time).getTime(), Date.now());
        const sim = scene === "empty" ? {} : simulate(t0, t1);
        const res = {};
        if (msg.period === "day") {
          for (const id of msg.statistic_ids) {
            const values = sim[id];
            if (!values) continue;
            res[id] = [];
            const d = new Date(t0);
            d.setHours(0, 0, 0, 0);
            for (let start = d.getTime(); start < t1; start += 86400e3) {
              const i0 = Math.max(0, Math.floor((start - t0) / STEP));
              const i1 = Math.min(values.length, Math.floor((start + 86400e3 - t0) / STEP));
              if (i1 <= i0) continue;
              const today = COUNTERS[id]?.[1];
              const change = today ? values[i1 - 1] : values[i1 - 1] - values[i0];
              res[id].push({ start, end: start + 86400e3, change });
            }
          }
          return res;
        }
        const per = msg.period === "hour" ? 12 : 1;
        for (const id of msg.statistic_ids) {
          const values = sim[id];
          if (!values) continue;
          res[id] = [];
          for (let i = 0; i + per <= values.length; i += per) {
            const chunk = values.slice(i, i + per).filter((v) => v !== null);
            if (!chunk.length) continue;
            res[id].push({ start: t0 + i * STEP, end: t0 + (i + per) * STEP,
              mean: chunk.reduce((a, b) => a + b, 0) / chunk.length, min: Math.min(...chunk), max: Math.max(...chunk),
              state: chunk.at(-1) });
          }
        }
        return res;
      }
      if (msg.type === "energy_hub/pv_layout") return scene === "empty" ? { found: false, panels: [], strings: [], installation: {} } : layout;
      console.log("WS", msg);
      return null;
    },
  };

  try {
    localStorage.setItem("energy-hub-tab", q.get("tab") || "overview");
  } catch (_err) {
    // ohne Speicher startet das Panel in der Übersicht
  }
  const panel = document.createElement("energy-hub-panel");
  document.body.append(panel);
  panel.narrow = innerWidth < 870;
  panel.hass = hass;
</script>
