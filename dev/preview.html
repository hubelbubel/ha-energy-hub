<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Hub – Vorschau mit Beispieldaten</title>
<style>
  html, body { margin: 0; }
  body { font-family: Roboto, system-ui, sans-serif; }
  body.dark {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --primary-background-color: #111111; --card-background-color: #1c1c1c;
    --divider-color: rgba(225, 225, 225, 0.12); --primary-color: #03a9f4;
  }
  body.light {
    --primary-text-color: #212121; --secondary-text-color: #727272;
    --primary-background-color: #fafafa; --card-background-color: #ffffff;
    --divider-color: rgba(0, 0, 0, 0.12); --primary-color: #03a9f4;
  }
</style>
</head>
<body class="light">
<!--
  Vorschau des Panels ohne Home Assistant, mit erfundenen Beispieldaten.
  Start:  python3 -m http.server 8000   (im Hauptordner des Repositories)
  Dann:   http://localhost:8000/dev/preview.html
  Parameter: ?theme=dark  ?mode=normal|boost|setback|override|empty
-->
<script type="module">
  import "../custom_components/energy_hub/frontend/energy-hub-panel.js";

  const q = new URLSearchParams(location.search);
  const dark = q.get("theme") === "dark";
  const scene = q.get("mode") || "boost";
  document.body.className = dark ? "dark" : "light";

  const now = Date.now();
  const iso = (ms) => new Date(ms).toISOString();
  const ent = {
    ent_flow: "sensor.wp_vorlauftemperatur", ent_return: "sensor.wp_rucklauftemperatur",
    ent_return_target: "sensor.wp_rucklaufsolltemperatur", ent_dhw: "sensor.wp_warmwassertemperatur",
    ent_dhw_target: "sensor.wp_warmwasser_soll_aktuell", ent_outdoor: "sensor.wp_aussentemperatur",
    ent_status: "sensor.wp_status", ent_compressor: "binary_sensor.wp_verdichter_1",
    ent_power_el: "sensor.wp_elektrische_leistung", ent_power_heat: "sensor.wp_heizleistung",
    ent_pv_surplus: "sensor.pv_ueberschuss", ent_forecast_today: "sensor.pv_prognose_rest_heute",
    ent_forecast_tomorrow: "sensor.pv_prognose_morgen",
    ent_smart_grid: "select.wp_smart_grid_setzen", ent_shift: null,
    ent_energy_el: null, ent_energy_heat: "sensor.wp_warmemenge_heizen",
    ent_energy_dhw: "sensor.wp_warmemenge_warmwasser", ent_energy_env: null,
    ent_heater: "binary_sensor.wp_flanschheizung_e9", ent_second_heat: null,
    ent_storage: "sensor.wp_regenerativspeicher_temperatur", ent_lock: "sensor.wp_sperre",
    ent_fireplace: "sensor.kamin_exhaust_temperature", ent_fireplace_status: "sensor.kamin_status",
  };
  const fireNow = scene === "setback" || scene === "override";
  const extra = ["sensor.wp_statuscode", "binary_sensor.wp_heizungspumpe_m13"];
  const st = (state, unit) => ({ state: String(state), attributes: { unit_of_measurement: unit } });
  const running = scene !== "normal";
  const states = {
    [ent.ent_flow]: st(running ? 36.4 : 29.1, "°C"), [ent.ent_return]: st(running ? 31.2 : 28.6, "°C"),
    [ent.ent_return_target]: st(scene === "boost" ? 33.0 : 30.5, "°C"), [ent.ent_dhw]: st(48.3, "°C"),
    [ent.ent_dhw_target]: st(scene === "boost" ? 55 : 48, "°C"), [ent.ent_outdoor]: st(6.4, "°C"),
    [ent.ent_status]: st(running ? "Heizen" : "Aus"), [ent.ent_compressor]: st(running ? "on" : "off"),
    [ent.ent_power_el]: st(running ? 1840 : 40, "W"), [ent.ent_power_heat]: st(running ? 7350 : 0, "W"),
    [ent.ent_pv_surplus]: st(2140, "W"), [ent.ent_forecast_today]: st(11.8, "kWh"),
    [ent.ent_forecast_tomorrow]: st(19.4, "kWh"),
    [ent.ent_storage]: st(fireNow ? 58.4 : 36.2, "°C"), [ent.ent_lock]: st(fireNow ? "Regenerativ" : "Keine"),
    [ent.ent_fireplace]: st(fireNow ? 246 : 28, "°C"), [ent.ent_fireplace_status]: st(fireNow ? "Heizbetrieb" : "Standby"),
  };

  const log = scene === "empty" ? [] : [
    { ts: iso(now - 38 * 60e3), kind: "switch", from: "normal", to: "boost", result: "sent",
      detail: "select.wp_smart_grid_setzen → Verstärkter Betrieb (grün)",
      text: "Der PV-Überschuss liegt seit 10 min über 1.500 W (aktuell 2.140 W).",
      values: { surplus_w: 2140, forecast_kwh: 11.8, outdoor_c: 6.4, dhw_c: 46.1 } },
    { ts: iso(now - 150 * 60e3), kind: "switch", from: "setback", to: "normal", result: "sent",
      detail: "select.wp_smart_grid_setzen → Normalbetrieb (gelb)",
      text: "Der PV-Überschuss von 420 W liegt unter der Einschaltschwelle von 1.500 W. Abgesenkt wird nur 05:00–10:00 Uhr.",
      values: { surplus_w: 420, forecast_kwh: 14.9, outdoor_c: 4.8, dhw_c: 44.0 } },
    { ts: iso(now - 420 * 60e3), kind: "switch", from: "normal", to: "setback", result: "sent",
      detail: "select.wp_smart_grid_setzen → Abgesenkter Betrieb (rot)",
      text: "Für den Rest des Tages sind 18,2 kWh PV-Ertrag vorhergesagt. Die Heizung wartet im Absenkfenster (05:00–10:00 Uhr) auf eigenen Strom.",
      values: { surplus_w: 0, forecast_kwh: 18.2, outdoor_c: 3.6, dhw_c: 46.5 } },
    { ts: iso(now - 26 * 3600e3), kind: "error", from: "boost", to: null, result: "failed",
      detail: "select.wp_smart_grid_setzen ist nicht verfügbar.",
      text: "Die Vorgabe „Normalbetrieb“ konnte nicht gesetzt werden. Nächster Versuch um 16:52 Uhr.",
      values: { surplus_w: 120, forecast_kwh: 0.4, outdoor_c: 5.1, dhw_c: 51.2 } },
    { ts: iso(now - 29 * 3600e3), kind: "override", text: "Handbetrieb gestartet: Anheben, bis 15:40 Uhr.",
      values: { surplus_w: 900, forecast_kwh: 3.1, outdoor_c: 7.0, dhw_c: 43.9 } },
    { ts: iso(now - 30 * 3600e3), kind: "automation", text: "Automatik eingeschaltet.", values: {} },
  ];

  const mode = { boost: "boost", setback: "setback", override: "setback" }[scene] || "normal";
  const snapshot = {
    version: "0.3.1",
    export_extra: scene === "empty" ? [] : extra,
    entities: scene === "empty"
      ? { ...ent, ent_pv_surplus: null, ent_forecast_today: null, ent_forecast_tomorrow: null,
          ent_storage: null, ent_lock: null, ent_fireplace: null, ent_fireplace_status: null }
      : ent,
    settings: {
      boost_on_w: 1500, boost_on_min: 10, boost_off_w: 300, boost_off_min: 15, min_hold_min: 20,
      setback_enabled: true, setback_start: "05:00:00", setback_end: "10:00:00",
      setback_min_forecast_kwh: 10, setback_min_outdoor_c: 3, setback_min_dhw_c: 42,
      actuator: scene === "empty" ? "dry_run" : "smart_grid", shift_boost_k: 2, shift_setback_k: 2,
      surplus_sign: "surplus_positive",
      storage_ready_delta_k: 5, storage_ready_c: 40, storage_blocks_boost: true, fireplace_on_c: 80, lock_regen_value: "Regenerativ",
    },
    state: {
      mode, since: iso(now - 38 * 60e3), automation: true, dry_run: scene === "empty",
      override: scene === "override" ? { mode: "setback", until: iso(now + 95 * 60e3) } : null,
      reason: {
        boost: "Der PV-Überschuss reicht weiter aus (aktuell 2.140 W). Beendet wird unter 300 W für 15 min.",
        setback: "Für den Rest des Tages sind 11,8 kWh PV-Ertrag vorhergesagt. Die Heizung wartet im Absenkfenster (05:00–10:00 Uhr) auf eigenen Strom.",
        normal: "Der PV-Überschuss von 2.140 W liegt erst seit 4 min über 1.500 W; angehoben wird nach 10 min. Abgesenkt wird nur 05:00–10:00 Uhr.",
      }[mode],
      rule: "boost_keep", state_entity_id: "sensor.energy_hub_regelzustand", last_error: null, retry_at: null,
      above_since: scene === "empty" ? null : iso(now - 48 * 60e3), below_since: null,
      inputs: { surplus_w: scene === "empty" ? null : 2140, forecast_kwh: 11.8, forecast_tomorrow_kwh: 19.4, outdoor_c: 6.4, dhw_c: 48.3 },
    },
    log, log_rev: 1,
  };

  // Erfundener Tagesverlauf: Sonne mittags, Heizung taktet, Warmwasser wird mittags geladen
  function history(id, t0, t1) {
    const rows = [];
    const stepMs = 5 * 60e3;
    for (let t = t0; t <= t1; t += stepMs) {
      const d = new Date(t);
      const hour = d.getHours() + d.getMinutes() / 60;
      const sun = Math.max(0, Math.sin(((hour - 7.5) / 9.5) * Math.PI));
      const cloud = 0.75 + 0.25 * Math.sin(t / 9e5) * Math.cos(t / 23e5);
      const boost = hour > 11.2 && hour < 15.4;
      const setback = hour >= 5 && hour < 9.5;
      const cyc = Math.sin(t / 26e5);
      const fire = hour >= 17.5 && hour < 21.5;
      const storeTemp = fire ? 36 + (hour - 17.5) * 8.5 : 70 - ((hour + 24 - 21.5) % 24) * 1.9;
      let v;
      if (id === ent.ent_pv_surplus) v = Math.round(sun * cloud * 3900 - 350);
      else if (id === ent.ent_outdoor) v = 3 + 5 * Math.max(0, Math.sin(((hour - 6) / 14) * Math.PI));
      else if (id === ent.ent_flow) v = (boost ? 36 : setback ? 27.5 : 31.5) + 2.4 * cyc;
      else if (id === ent.ent_return) v = (boost ? 31.5 : setback ? 25.5 : 28.3) + 1.6 * cyc;
      else if (id === ent.ent_dhw) v = boost ? 44 + (hour - 11.2) * 2.6 : 50.5 - ((hour + 24 - 15.4) % 24) * 0.42;
      else if (id === snapshot.state.state_entity_id) v = boost ? "boost" : setback ? "setback" : "normal";
      else if (id === ent.ent_compressor) v = cyc > -0.3 ? "on" : "off";
      else if (id === ent.ent_status) v = cyc > -0.3 ? (hour > 12 && hour < 13 ? "Warmwasser" : "Heizen") : "Aus";
      else if (id === ent.ent_power_el) v = cyc > -0.3 ? 1800 + 300 * cyc : 40;
      else if (id === ent.ent_power_heat) v = cyc > -0.3 ? 7200 + 800 * cyc : 0;
      else if (id === ent.ent_heater) v = hour >= 13 && hour < 13.2 ? "on" : "off";
      else if (id === ent.ent_energy_heat) v = 5000 + Math.floor((t / 3600e3) * 3.1) % 100000;
      else if (id === ent.ent_energy_dhw) v = 900 + Math.floor((t / 86400e3) * 6) % 10000;
      else if (id === ent.ent_return_target) v = boost ? 33 : setback ? 27 : 30.5;
      else if (id === ent.ent_dhw_target) v = boost ? 55 : 48;
      else if (id === ent.ent_forecast_today) v = Math.max(0, 19 - hour * 1.2);
      else if (id === ent.ent_forecast_tomorrow) v = 19.4;
      else if (id === ent.ent_smart_grid) v = boost ? "Verstärkter Betrieb (grün)" : setback ? "Abgesenkter Betrieb (rot)" : "Normalbetrieb (gelb)";
      else if (id === ent.ent_storage) v = storeTemp;
      else if (id === ent.ent_fireplace) v = fire ? 235 + 40 * Math.sin(t / 4e5) : 28;
      else if (id === ent.ent_fireplace_status) v = fire ? "Heizbetrieb" : "Standby";
      else if (id === ent.ent_lock) v = storeTemp >= 42 && Math.sin(t / 19e5) > 0.1 ? "Regenerativ" : "Keine";
      else if (id === "sensor.wp_statuscode") v = cyc > -0.3 ? 2 : 0;
      else if (id === "binary_sensor.wp_heizungspumpe_m13") v = "on";
      else continue;
      rows.push({ s: String(typeof v === "number" ? Math.round(v * 10) / 10 : v), lu: t / 1000 });
    }
    return rows;
  }

  const hass = {
    themes: { darkMode: dark },
    states,
    connection: {
      subscribeMessage(cb) { setTimeout(() => cb(structuredClone(snapshot)), 30); return Promise.resolve(() => {}); },
    },
    async callWS(msg) {
      if (msg.type === "history/history_during_period") {
        const t0 = new Date(msg.start_time).getTime();
        const t1 = new Date(msg.end_time).getTime();
        return Object.fromEntries(msg.entity_ids.map((id) => [id, scene === "empty" ? [] : history(id, t0, t1)]));
      }
      if (msg.type === "recorder/statistics_during_period") return {};
      console.log("WS", msg);
      return null;
    },
  };

  const panel = document.createElement("energy-hub-panel");
  document.body.append(panel);
  panel.narrow = innerWidth < 870;
  panel.hass = hass;
</script>
</body>
</html>
