        data_type: uint16
        unit_of_measurement: "K"
        scan_interval: 300

      # ------------------------------------------------------------------
      # Einstellungen 2. Wärmeerzeuger (R/W)
      # ------------------------------------------------------------------
      # -25...35 °C
      - name: "WP 2WE Grenztemperatur parallel"
        unique_id: dimplex_wpm_reg_227
        slave: 1
        address: 227
        data_type: int16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 300
      # 0,5...2,0 K
      - name: "WP 2WE Mischer Hysterese"
        unique_id: dimplex_wpm_reg_48
        slave: 1
        address: 48
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "K"
        scan_interval: 300
      # 1...6 min
      - name: "WP 2WE Mischerlaufzeit"
        unique_id: dimplex_wpm_reg_228
        slave: 1
        address: 228
        data_type: uint16
        unit_of_measurement: "min"
        scan_interval: 300

      # ------------------------------------------------------------------
      # Funktionen (R/W)
      # ------------------------------------------------------------------
      # ab M 1.3: 0 Hardware-Eingang, 10 Gelb/Normal, 11 Grün/verstärkt, 12 Rot/abgesenkt, 13 Dunkelgrün. Nach Spannungsreset wieder 0
      - name: "WP Smart Grid Code"
        unique_id: dimplex_wpm_reg_374
