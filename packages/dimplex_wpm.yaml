        unique_id: dimplex_wpm_reg_337
        slave: 1
        address: 337
        data_type: uint16
        scan_interval: 60
      # Extern vorgebbare Außentemperatur (-99,9 = nicht beschrieben). Vor M 3.15 nur nach Freischaltung durch den Kundendienst wirksam
      - name: "WP Aussentemperatur BMS"
        unique_id: dimplex_wpm_reg_112
        slave: 1
        address: 112
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 300
      # Heartbeat (erst ab M 3.14, bei M 3.11 nicht vorhanden): Register 62 (schreiben) / 63 (lesen)

      # ------------------------------------------------------------------
      # OPTIONAL: Einstellungen 2./3. Heizkreis (R/W)
      # ------------------------------------------------------------------
      # Vor dem Lesen/Schreiben wird über Register 289 der Kreis gewählt (2 oder 3).
      # - name: "WP HK2-3 Auswahl Heizkreis"
