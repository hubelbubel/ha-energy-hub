# =============================================================================
# Klartext, Summen und Schreibfunktionen
# =============================================================================
template:
  - sensor:
      - name: "WP Status"
        unique_id: dimplex_wpm_status_text
        icon: mdi:heat-pump
        availability: "{{ has_value('sensor.wp_statuscode') }}"
        state: >-
          {% set m = {0: 'Aus', 1: 'Aus', 2: 'Heizen', 3: 'Schwimmbad', 4: 'Warmwasser', 5: 'Kühlen', 10: 'Abtauen', 11: 'Durchflussüberwachung', 24: 'Verzögerung Betriebsmodusumschaltung', 30: 'Sperre'} %}
          {% set v = states('sensor.wp_statuscode') | int(-1) %}
          {{ m.get(v, 'Unbekannt (' ~ v ~ ')') }}
      - name: "WP Sperre"
        unique_id: dimplex_wpm_sperre_text
        icon: mdi:lock-clock
        availability: "{{ has_value('sensor.wp_sperrcode') }}"
        state: >-
          {% set m = {0: 'Keine', 2: 'Volumenstrom', 5: 'Funktionskontrolle', 6: 'Einsatzgrenze HT', 7: 'Systemkontrolle', 8: 'Verzögerung Umschaltung Kühlen', 9: 'Pumpenvorlauf', 10: 'Mindeststandzeit', 11: 'Netzbelastung', 12: 'Schaltspielsperre', 13: 'Warmwasser Nacherwärmung', 14: 'Regenerativ', 15: 'EVU-Sperre', 16: 'Sanftanlasser', 17: 'Durchfluss', 18: 'Einsatzgrenze Wärmepumpe', 19: 'Hochdruck', 20: 'Niederdruck', 21: 'Einsatzgrenze Wärmequelle', 23: 'System Grenze', 24: 'Last Primärkreis', 25: 'Sperre Extern', 29: 'Inverter', 31: 'Aufwärmen', 33: 'EvD Initialisierung', 34: '2. Wärmeerzeuger freigegeben', 35: 'Störung'} %}
          {% set v = states('sensor.wp_sperrcode') | int(-1) %}
          {{ m.get(v, 'Unbekannt (' ~ v ~ ')') }}
      - name: "WP Störung"
        unique_id: dimplex_wpm_stoerung_text
        icon: mdi:alert-circle-outline
        availability: "{{ has_value('sensor.wp_fehlercode') }}"
        state: >-
          {% set m = {0: 'Kein Fehler', 1: 'Fehler N17.1', 2: 'Fehler N17.2', 3: 'Fehler N17.3', 4: 'Fehler N17.4', 6: 'Elektronisches Ex.Ventil', 10: 'WPIO', 12: 'Inverter', 13: 'WQIF', 15: 'Sensorfehler', 16: 'Niederdruck Sole', 19: '!Primärkreis', 20: '!Abtauen', 21: '!Niederdruck Sole', 22: '!Warmwasser', 23: '!Last Verdichter', 24: '!Codierung', 25: '!Niederdruck', 26: '!Frostschutz', 28: '!Hochdruck', 29: '!Temperatur Differenz', 30: '!Heissgasthermostat', 31: '!Durchfluss', 32: '!Aufwärmen'} %}
          {% set v = states('sensor.wp_fehlercode') | int(-1) %}
          {{ m.get(v, 'Unbekannt (' ~ v ~ ')') }}
      - name: "WP Sensorfehler"
        unique_id: dimplex_wpm_sensorfehler_text
        icon: mdi:thermometer-alert
        availability: "{{ has_value('sensor.wp_sensorfehlercode') }}"
        state: >-
          {% set m = {0: 'Kein Fehler', 1: 'Außenfühler (R1)', 2: 'Rücklauffühler (R2)', 3: 'Warmwasserfühler (R3)', 4: 'Codierung (R7)', 5: 'Vorlauffühler (R9)', 6: '2. Heizkreisfühler (R5)', 7: '3. Heizkreisfühler (R13)', 8: 'Regenerativfühler (R13)', 9: 'Raumfühler 1', 10: 'Raumfühler 2', 11: 'Fühler Wärmequellenaustritt (R6)', 12: 'Fühler Wärmequelleneintritt (R24)', 14: 'Kollektorfühler (R23)', 15: 'Niederdrucksensor (R25)', 16: 'Hochdrucksensor (R26)', 17: 'Raumfeuchte 1', 18: 'Raumfeuchte 2', 19: 'Fühler Frostschutz-Kälte', 20: 'Heißgas', 21: 'Rücklauffühler (R2.1)', 22: 'Schwimmbadfühler (R20)', 23: 'Vorlauffühler Kühlen Passiv (R11)', 24: 'Rücklauffühler Kühlen Passiv (R4)', 26: 'Fühler Solarspeicher (R22)', 28: 'Anforderungsfühler Heizen (R2.2)', 29: 'RTM Econ', 30: 'Anforderungsfühler Kühlen (R39)', 37: 'Öltemperaturfühler Verdichter 1', 39: 'Öltemperaturfühler Verdichter 2', 41: 'Heißgasfühler Verdichter 1', 43: 'Heißgasfühler Verdichter 2', 45: 'Verdampfer Lufteintrittsfühler', 48: 'Durchflusssensor Sekundärkreis', 49: 'Drucksensor Sekundärkreis', 50: 'Durchflusssensor Primärkreis', 51: 'Drucksensor Primärkreis', 52: 'Sauggasfühler'} %}
          {% set v = states('sensor.wp_sensorfehlercode') | int(-1) %}
          {{ m.get(v, 'Unbekannt (' ~ v ~ ')') }}
      - name: "WP Betriebsmodus"
        unique_id: dimplex_wpm_betriebsmodus_text
        icon: mdi:sun-snowflake-variant
        availability: "{{ has_value('sensor.wp_betriebsmodus_code') }}"
        state: >-
          {% set m = {0: 'Sommer', 1: 'Winter', 2: 'Urlaub', 3: 'Party', 4: '2. Wärmeerzeuger', 5: 'Kühlen'} %}
          {% set v = states('sensor.wp_betriebsmodus_code') | int(-1) %}
          {{ m.get(v, 'Unbekannt (' ~ v ~ ')') }}
      - name: "WP Smart Grid"
        unique_id: dimplex_wpm_smart_grid_text
        icon: mdi:transmission-tower
        availability: "{{ has_value('sensor.wp_smart_grid_code') }}"
        state: >-
          {% set m = {0: 'Hardware-Eingang', 10: 'Normalbetrieb (gelb)', 11: 'Verstärkter Betrieb (grün)', 12: 'Abgesenkter Betrieb (rot)', 13: 'Verstärkt Stufe 3 (dunkelgrün)'} %}
          {% set v = states('sensor.wp_smart_grid_code') | int(-1) %}
          {{ m.get(v, 'Unbekannt (' ~ v ~ ')') }}
      - name: "WP Softwarestand"
        unique_id: dimplex_wpm_softwarestand
        icon: mdi:chip
        availability: >-
          {{ has_value('sensor.wp_software_buchstabe') and has_value('sensor.wp_software_nummer') and has_value('sensor.wp_software_index') }}
        state: >-
          {% set b = states('sensor.wp_software_buchstabe') | int(0) %}
          {{ ('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[b - 1] if 1 <= b <= 26 else '?')
             ~ states('sensor.wp_software_nummer') ~ '.' ~ states('sensor.wp_software_index') }}
      # Summen der Wärmemengenzähler. Die drei Teilregister werden nacheinander gelesen;
      # beim Überlauf eines Teilregisters kann kurz ein falscher Wert entstehen.
      - name: "WP Wärmemenge Heizen"
        unique_id: dimplex_wpm_waermemenge_heizen
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >-
          {{ has_value('sensor.wp_wmz_heizen_teil_1') and has_value('sensor.wp_wmz_heizen_teil_2') and has_value('sensor.wp_wmz_heizen_teil_3') }}
        state: >-
          {{ states('sensor.wp_wmz_heizen_teil_3') | int * 100000000
             + states('sensor.wp_wmz_heizen_teil_2') | int * 10000
             + states('sensor.wp_wmz_heizen_teil_1') | int }}
      - name: "WP Wärmemenge Warmwasser"
        unique_id: dimplex_wpm_waermemenge_warmwasser
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >-
          {{ has_value('sensor.wp_wmz_warmwasser_teil_1') and has_value('sensor.wp_wmz_warmwasser_teil_2') and has_value('sensor.wp_wmz_warmwasser_teil_3') }}
        state: >-
          {{ states('sensor.wp_wmz_warmwasser_teil_3') | int * 100000000
             + states('sensor.wp_wmz_warmwasser_teil_2') | int * 10000
             + states('sensor.wp_wmz_warmwasser_teil_1') | int }}
      - name: "WP Umweltenergie"
        unique_id: dimplex_wpm_umweltenergie
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >-
          {{ has_value('sensor.wp_umweltenergie_teil_1') and has_value('sensor.wp_umweltenergie_teil_2') and has_value('sensor.wp_umweltenergie_teil_3') }}
        state: >-
          {{ states('sensor.wp_umweltenergie_teil_3') | int * 100000000
             + states('sensor.wp_umweltenergie_teil_2') | int * 10000
             + states('sensor.wp_umweltenergie_teil_1') | int }}

  - select:
      - name: "WP Betriebsmodus setzen"
        unique_id: dimplex_wpm_select_betriebsmodus
        icon: mdi:sun-snowflake-variant
        availability: "{{ has_value('sensor.wp_betriebsmodus_code') }}"
        options: "{{ ['Sommer', 'Winter', 'Urlaub', 'Party', '2. Wärmeerzeuger', 'Kühlen'] }}"
        state: >-
          {% set m = {0: 'Sommer', 1: 'Winter', 2: 'Urlaub', 3: 'Party', 4: '2. Wärmeerzeuger', 5: 'Kühlen'} %}
          {{ m.get(states('sensor.wp_betriebsmodus_code') | int(-1)) }}
        select_option:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 222
              value: >-
                {% set m = {'Sommer': 0, 'Winter': 1, 'Urlaub': 2, 'Party': 3, '2. Wärmeerzeuger': 4, 'Kühlen': 5} %}
                {{ m[option] }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_betriebsmodus_code
      # Grün = Warmwasser auf Maximaltemperatur laden + Heizung um den Anhebungswert anheben. Danach wieder auf Normalbetrieb (gelb) oder Hardware-Eingang stellen.
      - name: "WP Smart Grid setzen"
        unique_id: dimplex_wpm_select_smart_grid
        icon: mdi:transmission-tower
        availability: "{{ has_value('sensor.wp_smart_grid_code') }}"
        options: "{{ ['Hardware-Eingang', 'Normalbetrieb (gelb)', 'Verstärkter Betrieb (grün)', 'Abgesenkter Betrieb (rot)', 'Verstärkt Stufe 3 (dunkelgrün)'] }}"
        state: >-
          {% set m = {0: 'Hardware-Eingang', 10: 'Normalbetrieb (gelb)', 11: 'Verstärkter Betrieb (grün)', 12: 'Abgesenkter Betrieb (rot)', 13: 'Verstärkt Stufe 3 (dunkelgrün)'} %}
          {{ m.get(states('sensor.wp_smart_grid_code') | int(-1)) }}
        select_option:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 374
              value: >-
                {% set m = {'Hardware-Eingang': 0, 'Normalbetrieb (gelb)': 10, 'Verstärkter Betrieb (grün)': 11, 'Abgesenkter Betrieb (rot)': 12, 'Verstärkt Stufe 3 (dunkelgrün)': 13} %}
                {{ m[option] }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_smart_grid_code
      # Was die Sperre bewirkt (Frostschutz, Urlaub, Sperre Warmwasser, Sommer), wird am WPM eingestellt.
      - name: "WP Sperre Extern setzen"
        unique_id: dimplex_wpm_select_sperre_extern
        icon: mdi:lock-outline
        availability: "{{ has_value('sensor.wp_sperre_extern_code') }}"
        options: "{{ ['Hardware-Eingang', 'Sperre nicht aktiv', 'Sperre aktiv'] }}"
        state: >-
          {% set m = {0: 'Hardware-Eingang', 10: 'Sperre nicht aktiv', 11: 'Sperre aktiv'} %}
          {{ m.get(states('sensor.wp_sperre_extern_code') | int(-1)) }}
        select_option:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 337
              value: >-
                {% set m = {'Hardware-Eingang': 0, 'Sperre nicht aktiv': 10, 'Sperre aktiv': 11} %}
                {{ m[option] }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_sperre_extern_code

  - number:
      - name: "WP Warmwasser Solltemperatur setzen"
        unique_id: dimplex_wpm_num_ww_soll
        icon: mdi:water-thermometer
        availability: "{{ has_value('sensor.wp_warmwasser_solltemperatur') }}"
        state: "{{ states('sensor.wp_warmwasser_solltemperatur') }}"
        min: 30
        max: 60
        step: 1
        unit_of_measurement: "°C"
        set_value:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 254
              value: "{{ value | int }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_warmwasser_solltemperatur
      # Ziel bei Smart Grid Grün. Darf nicht unter der Solltemperatur liegen.
      - name: "WP Warmwasser Maximaltemperatur setzen"
        unique_id: dimplex_wpm_num_ww_max
        icon: mdi:water-thermometer
        availability: "{{ has_value('sensor.wp_warmwasser_maximaltemperatur') }}"
