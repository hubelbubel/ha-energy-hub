      # Einstellungen 1. Heiz-/Kühlkreis (R/W)
      # ------------------------------------------------------------------
      # Rohwert 0...38 entspricht -19...+19 (19 = 0). Anzeige hier bereits umgerechnet
      - name: "WP Parallelverschiebung"
        unique_id: dimplex_wpm_reg_243
        slave: 1
        address: 243
        data_type: uint16
        scale: 1
        offset: -19
        precision: 0
        unit_of_measurement: "K"
        scan_interval: 60
      # 15,0...30,0 °C
      - name: "WP Raumsolltemperatur"
        unique_id: dimplex_wpm_reg_46
        slave: 1
        address: 46
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 60
      # 18...60 °C
      - name: "WP Festwertsolltemperatur"
        unique_id: dimplex_wpm_reg_244
        slave: 1
        address: 244
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 300
      # 20...70 °C
      - name: "WP Heizkurvenendpunkt"
        unique_id: dimplex_wpm_reg_245
        slave: 1
        address: 245
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 300
      # 0,5...5,0 K
      - name: "WP Heizkreis 1 Hysterese"
        unique_id: dimplex_wpm_reg_47
        slave: 1
        address: 47
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "K"
        scan_interval: 300
      # dynamische Kühlung, 10...35 °C
      - name: "WP Kuehlen Solltemperatur bei 15 Grad AT"
        unique_id: dimplex_wpm_reg_250
        slave: 1
        address: 250
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 300
      # dynamische Kühlung, 10...35 °C
      - name: "WP Kuehlen Solltemperatur bei 35 Grad AT"
        unique_id: dimplex_wpm_reg_341
        slave: 1
        address: 341
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 300

      # ------------------------------------------------------------------
      # Einstellungen Warmwasser (R/W)
      # ------------------------------------------------------------------
      # Solltemp. Min ... 85 °C
      - name: "WP Warmwasser Solltemperatur"
        unique_id: dimplex_wpm_reg_254
        slave: 1
        address: 254
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 60
      # Wird im Smart-Grid-Zustand Grün als Ziel benutzt
      - name: "WP Warmwasser Maximaltemperatur"
        unique_id: dimplex_wpm_reg_255
        slave: 1
        address: 255
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 300
      # Wird im Smart-Grid-Zustand Rot als Ziel benutzt
