      #   scan_interval: 300
      # Hinweis: 1...6 min
      # - name: "WP HK2-3 Mischerlaufzeit"
      #   unique_id: dimplex_wpm_reg_294
      #   slave: 1
      #   address: 294
      #   data_type: uint16
      #   unit_of_measurement: "min"
      #   scan_interval: 300
      # Hinweis: 0,5...2,0 K
      # - name: "WP HK2-3 Mischerhysterese"
      #   unique_id: dimplex_wpm_reg_93
      #   slave: 1
      #   address: 93
      #   data_type: uint16
      #   scale: 0.1
      #   precision: 1
      #   unit_of_measurement: "K"
      #   scan_interval: 300
      # Hinweis: 30...70 °C
      # - name: "WP HK2-3 Maximale Temperatur"
