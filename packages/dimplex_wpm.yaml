      #   scan_interval: 300

      # ------------------------------------------------------------------
      # OPTIONAL: Raumtemperaturregelung über BMS (R/W, muss vom Kundendienst aktiviert sein)
      # ------------------------------------------------------------------
      # Ist-Temperatur wird auf Register 11, Ist-Feuchte auf Register 13 geschrieben (jeweils x10).
      # Hinweis: 50-59 = 1. Kreis, 60-69 = 2. Kreis, 70-79 = 3. Kreis
