      # Fühler R13. Das Wiki nennt Adresse 10 'Temperatur 3. Heizkreis (R13)'; beim WPM Touch ist R13 der Fühler im Regenerativspeicher. Mit dem Display vergleichen. Die Sperre 'Regenerativ' (Sperrcode 14) zeigt, wann der Speicher statt der Wärmepumpe liefert
