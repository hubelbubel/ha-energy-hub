      #   slave: 1
      #   address: 295
      #   data_type: uint16
      #   unit_of_measurement: "°C"
      #   device_class: temperature
      #   scan_interval: 300
      # Hinweis: Rohwert 0...30 entspricht 15,0...30,0 °C
      # - name: "WP HK2-3 Kühlung Raumsolltemperatur"
      #   unique_id: dimplex_wpm_reg_296
