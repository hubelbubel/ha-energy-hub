              address: 46
              value: "{{ (value | float * 10) | round(0) | int }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_raumsolltemperatur
      # Geschrieben wird Wert x 10.
      - name: "WP Heizkreis 1 Hysterese setzen"
        unique_id: dimplex_wpm_num_hk1_hyst
        icon: mdi:arrow-expand-vertical
