        max: 15
        step: 1
        unit_of_measurement: "K"
        set_value:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 252
              value: "{{ value | int }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_warmwasser_hysterese
      # Heizungsanhebung/-absenkung über die Heizkurve. Geschrieben wird Wert + 19.
      - name: "WP Parallelverschiebung setzen"
        unique_id: dimplex_wpm_num_parallelverschiebung
        icon: mdi:chart-line
        availability: "{{ has_value('sensor.wp_parallelverschiebung') }}"
        state: "{{ states('sensor.wp_parallelverschiebung') }}"
        min: -19
        max: 19
        step: 1
        unit_of_measurement: "K"
        set_value:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 243
              value: "{{ value | int + 19 }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_parallelverschiebung
      - name: "WP Heizkurvenendpunkt setzen"
        unique_id: dimplex_wpm_num_heizkurvenendpunkt
        icon: mdi:chart-bell-curve-cumulative
        availability: "{{ has_value('sensor.wp_heizkurvenendpunkt') }}"
        state: "{{ states('sensor.wp_heizkurvenendpunkt') }}"
        min: 20
        max: 70
        step: 1
        unit_of_measurement: "°C"
        set_value:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 245
              value: "{{ value | int }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_heizkurvenendpunkt
      - name: "WP Festwertsolltemperatur setzen"
        unique_id: dimplex_wpm_num_festwert
        icon: mdi:thermometer
        availability: "{{ has_value('sensor.wp_festwertsolltemperatur') }}"
