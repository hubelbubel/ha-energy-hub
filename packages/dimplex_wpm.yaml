        step: 1
        unit_of_measurement: "°C"
        set_value:
          - action: modbus.write_register
            data:
              hub: dimplex
              slave: 1
              address: 244
              value: "{{ value | int }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_festwertsolltemperatur
      # Geschrieben wird Wert x 10.
      - name: "WP Raumsolltemperatur setzen"
        unique_id: dimplex_wpm_num_raumsoll
        icon: mdi:home-thermometer
        availability: "{{ has_value('sensor.wp_raumsolltemperatur') }}"
