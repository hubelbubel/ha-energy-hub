# =============================================================================
# Dimplex Wärmepumpenmanager (WPM, Software M) über Modbus RTU
# Home-Assistant-Package für: Dimplex HPL 12S-TUW, WPM pCO5 M, Software M 3.11
#
# Anbindung:  WPM  ->  Carel PCOS004850 (= LWPM 410)  ->  RS485
#             ->  Waveshare RS485 TO ETH (B), Modus "Modbus TCP to RTU"  ->  LAN
#
# Quelle der Register: Dimplex Wiki, "Modbus RTU - Datenpunktliste" und
# "Modbus RTU - Funktionsbeschreibungen" (Spalte WPM-Software J/L/M bzw. L/M).
# Stand: 15.11.2026. NOCH NICHT AN DER ANLAGE GETESTET.
#
# -----------------------------------------------------------------------------
# EINBAU IN HOME ASSISTANT
# -----------------------------------------------------------------------------
# 1. In configuration.yaml (falls noch nicht vorhanden):
#
#      homeassistant:
#        packages: !include_dir_named packages
#
# 2. Diese Datei nach /config/packages/dimplex_wpm.yaml kopieren.
# 3. Unten bei "host" die IP des Waveshare eintragen, "port" an den Waveshare
#    anpassen (dort "Local Port" auf 502 stellen oder hier den Port ändern).
# 4. Entwicklerwerkzeuge -> YAML -> Konfiguration prüfen, dann HA neu starten.
#
# -----------------------------------------------------------------------------
# EINSTELLUNGEN AM WPM (Touch-Display: Einstellungen -> Netzwerk)
# -----------------------------------------------------------------------------
#   Protokoll: Modbus RTU   Adresse: 1   Baudrate: 9600 (oder 19200)
#   Parität: keine          Stoppbits: 1        -> also 9600 8N1
# Am Waveshare exakt dieselben seriellen Werte einstellen.
#
# -----------------------------------------------------------------------------
# ERSTE PRÜFUNG NACH DEM EINBAU (bitte in dieser Reihenfolge)
# -----------------------------------------------------------------------------
# a) "WP Außentemperatur", "WP Rücklauftemperatur" und "WP Warmwassertemperatur"
#    mit dem Display vergleichen.
#    - Stimmen sie: alles gut.
#    - Sind die Werte um einen Datenpunkt verschoben (Außentemperatur zeigt
#      z. B. den Rücklauf): bei ALLEN "address:"-Werten 1 abziehen.
# b) "WP Softwarestand" muss "M3.11" anzeigen. Zeigt er Unsinn, während die
#    Temperaturen stimmen, arbeitet der WPM im Adressbereich "1...127".
#    Dann bei allen Adressen ab 208 genau 80 abziehen (z. B. 222 -> 142,
#    254 -> 174). Die Liste hier entspricht dem Adressbereich "1...207".
# c) Erst wenn a) und b) passen, die Schreibfunktionen ("... setzen") benutzen.
#
# -----------------------------------------------------------------------------
# HINWEISE
# -----------------------------------------------------------------------------
# - Nicht jeder Datenpunkt ist an jeder Anlage belegt. Was dauerhaft 0 oder
#   -99.9 zeigt, ist bei dir nicht vorhanden -> Eintrag löschen/auskommentieren.
# - Auskommentierte Blöcke (Schwimmbad, Lüftung, Solar, 2./3. Heizkreis,
#   passive Kühlung, Raumregelung über BMS, Uhrzeit) sind Datenpunkte, die
#   eine HPL 12S-TUW normalerweise nicht nutzt. Bei Bedarf "# " entfernen.
# - Der Waveshare bedient den Bus allein. Nicht gleichzeitig mit einem
#   zweiten Modbus-Client auf denselben Wandler zugreifen.
# - Schreibzugriffe ändern echte Einstellungen der Wärmepumpe. Die Grenzen der
#   "number"-Entitäten sind bewusst enger gewählt als im Wiki erlaubt.
# =============================================================================

modbus:
  - name: dimplex
    type: tcp                      # Waveshare-Modus "Modbus TCP to RTU"
    # type: rtuovertcp             # nur falls der Waveshare auf "None" (transparent) steht
    host: 192.168.20.50            # <-- IP des Waveshare eintragen
    port: 502                      # <-- muss zum "Local Port" des Waveshare passen
    delay: 2
    timeout: 5
    message_wait_milliseconds: 50

    sensors:

      # ------------------------------------------------------------------
      # Systemstatus (Klartext dazu: siehe template-Sensoren weiter unten)
      # ------------------------------------------------------------------
      - name: "WP Statuscode"
        unique_id: dimplex_wpm_reg_103
        slave: 1
        address: 103
        data_type: uint16
        scan_interval: 30
      - name: "WP Sperrcode"
        unique_id: dimplex_wpm_reg_104
        slave: 1
        address: 104
        data_type: uint16
        scan_interval: 30
      - name: "WP Fehlercode"
        unique_id: dimplex_wpm_reg_105
        slave: 1
        address: 105
        data_type: uint16
        scan_interval: 30
      - name: "WP Sensorfehlercode"
        unique_id: dimplex_wpm_reg_106
        slave: 1
        address: 106
        data_type: uint16
        scan_interval: 60

      # ------------------------------------------------------------------
      # Softwarestand (Buchstabe 13 = M, Nummer, Index -> z. B. M3.11)
      # ------------------------------------------------------------------
      - name: "WP Software Buchstabe"
        unique_id: dimplex_wpm_reg_65
        slave: 1
        address: 65
        data_type: uint16
        scan_interval: 300
      - name: "WP Software Nummer"
        unique_id: dimplex_wpm_reg_66
        slave: 1
        address: 66
        data_type: uint16
        scan_interval: 300
      - name: "WP Software Index"
        unique_id: dimplex_wpm_reg_67
        slave: 1
        address: 67
        data_type: uint16
        scan_interval: 300

      # ------------------------------------------------------------------
      # Betriebsmodus (R/W): 0 Sommer, 1 Winter, 2 Urlaub, 3 Party, 4 2. Wärmeerzeuger, 5 Kühlen
      # ------------------------------------------------------------------
      - name: "WP Betriebsmodus Code"
        unique_id: dimplex_wpm_reg_222
        slave: 1
        address: 222
        data_type: uint16
        scan_interval: 60
      - name: "WP Partystunden"
        unique_id: dimplex_wpm_reg_223
        slave: 1
        address: 223
        data_type: uint16
        unit_of_measurement: "h"
        scan_interval: 300
      - name: "WP Urlaubstage"
        unique_id: dimplex_wpm_reg_224
        slave: 1
        address: 224
        data_type: uint16
        unit_of_measurement: "d"
        scan_interval: 300

      # ------------------------------------------------------------------
      # Betriebsdaten - Temperaturen (nur lesen, 0,1 °C)
      # ------------------------------------------------------------------
      # Fühler R1
      - name: "WP Außentemperatur"
        unique_id: dimplex_wpm_reg_1
        slave: 1
        address: 1
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30
      # Fühler R2
      - name: "WP Rücklauftemperatur"
