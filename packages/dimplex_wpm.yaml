      #   unit_of_measurement: "°C"
      #   device_class: temperature
      #   scan_interval: 300

      # ------------------------------------------------------------------
      # OPTIONAL: Einstellungen Schwimmbad (R/W)
      # ------------------------------------------------------------------
      # Hinweis: 5...60 °C
      # - name: "WP Schwimmbad Solltemperatur"
      #   unique_id: dimplex_wpm_reg_258
      #   slave: 1
